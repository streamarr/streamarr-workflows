name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify the shared scripts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check shell syntax
        run: find .github/actions -name '*.sh' -exec bash -n {} \;
      - name: Verify release and publication behavior
        run: python3 -m unittest discover -s tests -v

  # This checkout only fetches the action, which a calling repository pins by commit instead.
  build:
    name: build
    needs: [verify]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/require-jobs
        with:
          jobs: ${{ toJSON(needs) }}
