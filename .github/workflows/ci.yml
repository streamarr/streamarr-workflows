name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify the shared scripts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check shell syntax
        run: find .github/actions -name '*.sh' -exec bash -n {} \;
      - name: Verify release and publication behavior
        run: python3 -m unittest discover -s tests -v

  ffmpeg:
    name: Set up the pinned FFmpeg (${{ matrix.architecture }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
            sha256: 5a84a25963ef72e52aa042259b6be563abf734799556660fe1d1fc8879b15b2c
          - architecture: arm64
            runner: ubuntu-24.04-arm
            sha256: 07663c6fb54ae5e9adda50341023f3a845373075bc67e153f8b8577179d2a40a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ffmpeg
        with:
          release: v8.1.3-2-streamarr.1
          sha256: ${{ matrix.sha256 }}
      - name: Run the installed FFmpeg and FFprobe
        run: |
          test "$(command -v ffmpeg)" = "$RUNNER_TOOL_CACHE/streamarr-ffmpeg/install/bin/ffmpeg"
          ffmpeg -hide_banner -version
          ffprobe -hide_banner -version

  # This checkout only fetches the action, which a calling repository pins by commit instead.
  build:
    name: build
    needs: [verify, ffmpeg]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/require-jobs
        with:
          jobs: ${{ toJSON(needs) }}
