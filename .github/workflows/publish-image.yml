name: Publish verified image

on:
  workflow_call:
    inputs:
      image-repository:
        required: true
        type: string
      source-revision:
        required: true
        type: string
      version:
        required: true
        type: string
      artifact-pattern:
        required: true
        type: string
      publication-kind:
        required: true
        type: string
    secrets:
      dockerhub-username:
        required: true
      dockerhub-token:
        required: true
    outputs:
      image:
        description: Immutable multi-architecture image reference
        value: ${{ jobs.publish.outputs.image }}

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: publish-image-${{ inputs.image-repository }}-${{ inputs.publication-kind }}
      cancel-in-progress: false
    outputs:
      image: ${{ steps.publish.outputs.image }}
    steps:
      - name: Download verified native image receipts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ${{ inputs.artifact-pattern }}
          merge-multiple: true
      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.dockerhub-username }}
          password: ${{ secrets.dockerhub-token }}
      - name: Publish verified image
        id: publish
        uses: $/.github/actions/publish-image
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          image-repository: ${{ inputs.image-repository }}
          source-revision: ${{ inputs.source-revision }}
          version: ${{ inputs.version }}
          publication-kind: ${{ inputs.publication-kind }}
      - name: Preserve immutable image reference
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: published-image-${{ inputs.source-revision }}
          path: |
            image.json
            image-index.json
            image-metadata.json
            amd64-image.json
            arm64-image.json
          if-no-files-found: error
